  shots.forEach(s=>{
    for(const e of enemies){
      if(e.alive && Math.abs(s.x-e.x)<e.w/2+4 && Math.abs(s.y-e.y)<e.h/2+5){
        e.alive=false;s.y=-999;score+=100;hud();break;
      }
    }
  });

  bombs.forEach(b=>{
    if(Math.abs(b.x-player.x)<24 && Math.abs(b.y-player.y)<30){
      b.y=999;lives--;hud();if(lives<=0)gameOver=true;
    }
  });

  if(enemies.some(e=>e.alive&&e.y>player.y-42))gameOver=true;
  if(enemies.every(e=>!e.alive)){wave++;hud();newWave();}
}

function bindButton(id,key){
  const el=$(id);
  el.addEventListener("pointerdown",e=>{e.preventDefault();keys[key]=true;if(key===" ")shoot()});
  ["pointerup","pointercancel","pointerleave"].forEach(v=>el.addEventListener(v,()=>keys[key]=false));
}
bindButton("left","ArrowLeft");bindButton("right","ArrowRight");bindButton("fire"," ");
$("start").addEventListener("click",reset);

window.addEventListener("keydown",e=>{
  if(["ArrowLeft","ArrowRight"," ","a","d"].includes(e.key)){keys[e.key]=true;if(e.key===" ")e.preventDefault();}
  if(e.key==="Enter"&&!running)reset();
});
window.addEventListener("keyup",e=>keys[e.key]=false);

player={x:W/2,y:H-65};shots=[];bombs=[];enemies=[];draw();
})();
</script>
</body>
